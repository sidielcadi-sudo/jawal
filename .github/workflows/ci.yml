name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_OPTIONS: "--use-system-ca"

jobs:
  # ─────────── Étage 1 : qualité de code + unit tests (rapide) ───────────
  lint-and-unit:
    name: Lint + typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @jawal/db prisma:generate

      - name: Lint
        run: pnpm --filter @jawal/web lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (apps/web)
        run: pnpm --filter @jawal/web test

      - name: Unit tests (@jawal/shared)
        run: pnpm --filter @jawal/shared test

  # ─────────── Étage 2 : tests d'intégration avec Postgres + RLS ───────────
  integration:
    name: Integration tests (DB + RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jawal
          POSTGRES_PASSWORD: jawal
          POSTGRES_DB: jawal
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jawal -d jawal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Setup test DB (jawal_test)
        env:
          SUPERUSER_DATABASE_URL: postgresql://jawal:jawal@localhost:5433/postgres
        run: pnpm --filter @jawal/db test:setup-db

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://jawal:jawal@localhost:5433/jawal_test?schema=public
          TEST_DATABASE_URL_APP: postgresql://jawal_app:jawal_app@localhost:5433/jawal_test?schema=public
        run: pnpm --filter @jawal/web test:integration

  # ─────────── Étage 3 : E2E Playwright contre une vraie app + DB ───────────
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jawal
          POSTGRES_PASSWORD: jawal
          POSTGRES_DB: jawal
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jawal -d jawal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Generate Prisma client
        run: pnpm --filter @jawal/db prisma:generate

      - name: Install Playwright browsers
        run: pnpm --filter @jawal/web exec playwright install --with-deps chromium

      - name: Run E2E
        env:
          E2E_DATABASE_URL: postgresql://jawal:jawal@localhost:5433/jawal_e2e?schema=public
          E2E_DATABASE_URL_APP: postgresql://jawal_app:jawal_app@localhost:5433/jawal_e2e?schema=public
          CI: "1"
        run: pnpm --filter @jawal/web test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
