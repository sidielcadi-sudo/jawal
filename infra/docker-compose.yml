# Jawal — Infrastructure de développement local
#
# Usage :
#   pnpm infra:up      # démarre tout
#   pnpm infra:logs    # suivre les logs
#   pnpm infra:reset   # reset complet (efface les volumes)
#
# Services exposés :
#   - PostgreSQL   localhost:5433   (user/pass: jawal/jawal · db: jawal) — 5432 souvent occupé sur Windows
#   - Redis        localhost:6379
#   - MinIO        localhost:9000 (API) / localhost:9001 (console)
#   - Mailpit      localhost:1025 (SMTP) / localhost:8025 (UI)
#   - Solver       localhost:8001   (OR-Tools FastAPI — génération EDT)

name: jawal-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: jawal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jawal
      POSTGRES_PASSWORD: jawal
      POSTGRES_DB: jawal
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jawal -d jawal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jawal-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: jawal-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: jawal
      MINIO_ROOT_PASSWORD: jawal-secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: jawal-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI web
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  solver:
    build:
      context: ../apps/solver
      dockerfile: Dockerfile
    container_name: jawal-solver
    restart: unless-stopped
    # Diagnostic : conserve les requêtes reçues et le XML FET des échecs.
    environment:
      JAWAL_DUMP_DIR: /tmp/jawal-dump
    volumes:
      - ./solver-dump:/tmp/jawal-dump
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
