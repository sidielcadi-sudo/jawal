# Jawal — Infrastructure de développement local
#
# Usage :
#   pnpm infra:up      # démarre tout
#   pnpm infra:logs    # suivre les logs
#   pnpm infra:reset   # reset complet (efface les volumes)
#
# Services exposés :
#   - PostgreSQL   localhost:5433   (user/pass: jawal/jawal · db: jawal) — 5432 souvent occupé sur Windows
#   - Redis        localhost:6379
#   - Garage (S3)  localhost:9000 (API S3) / localhost:9001 (API admin)
#   - Mailpit      localhost:1025 (SMTP) / localhost:8025 (UI)
#   - Solver       localhost:8001   (OR-Tools FastAPI — génération EDT)

name: jawal-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: jawal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jawal
      POSTGRES_PASSWORD: jawal
      POSTGRES_DB: jawal
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jawal -d jawal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jawal-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Garage (S3-compatible) — remplace MinIO. Version exacte : l'API admin
  # utilisée par garage/init.sh est celle de la v2.
  garage:
    image: dxflrs/garage:v2.1.0
    container_name: jawal-garage
    restart: unless-stopped
    environment:
      # Config montée avec les droits de l'hôte : Garage refuse sinon un
      # secret lisible par tous.
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: 'true'
    ports:
      - "9000:3900"   # API S3 (port 9000 conservé : .env, adb-reverse mobile)
      - "9001:3903"   # API admin
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      # Image sans shell ni curl : `garage status` interroge le nœud en RPC.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Pose disposition, clé d'accès et bucket, puis s'arrête (idempotent).
  garage-init:
    image: curlimages/curl:8.11.1
    container_name: jawal-garage-init
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_TOKEN: jawal_dev_admin_token
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-GK2787f17cb62e5bad2e6444fd}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-92beb34feaa387b49684e0cd52e8c701ade89ca8db66a38ab9cddda91dd702b1}
      S3_BUCKET: ${S3_BUCKET:-jawal-dev}
    volumes:
      - ./garage/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: jawal-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI web
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  solver:
    build:
      context: ../apps/solver
      dockerfile: Dockerfile
    container_name: jawal-solver
    restart: unless-stopped
    # Diagnostic : conserve les requêtes reçues et le XML FET des échecs.
    environment:
      JAWAL_DUMP_DIR: /tmp/jawal-dump
    volumes:
      - ./solver-dump:/tmp/jawal-dump
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data:
