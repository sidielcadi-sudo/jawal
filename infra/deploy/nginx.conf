# Reverse proxy — accès par l'adresse IP du VPS, sans nom de domaine ni TLS.
#
# Dès qu'un domaine sera posé : ajouter un `server_name`, obtenir un certificat
# (certbot / acme.sh), rediriger 80 → 443 et activer HSTS. Tant qu'on est en
# HTTP nu, les mots de passe transitent en clair : réserver cet accès aux tests
# internes, pas à de vraies familles.

upstream jawal_web {
  # Alias déclaré sur le réseau de la pile (cf. docker-compose.stack.yml) :
  # « web » est ambigu, le réseau de la base porte déjà ce nom.
  server app-jawal:3000;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;

  # Tampons d en-tete genereux : sans nom de domaine, toutes les applications
  # de ce VPS partagent la meme adresse IP, et les cookies ignorent le port.
  # Les cookies des autres services (8000, 8001, 8002, 3000) repartent donc
  # dans chaque requete adressee a celui-ci, et le tampon par defaut (8 ko)
  # provoque un 400 « Request Header Or Cookie Too Large ».
  client_header_buffer_size 16k;
  large_client_header_buffers 8 32k;

  # Tampons de REPONSE : distincts de ceux de requete. Next renvoie les
  # cookies de session, et sur une IP partagee par plusieurs applications
  # l en-tete Set-Cookie depasse les 4 ko par defaut — nginx repond alors 502
  # « upstream sent too big header ».
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;

  # Les pièces jointes (justificatifs, documents d'inscription) montent à
  # plusieurs Mo ; la valeur par défaut (1 Mo) les refuserait.
  client_max_body_size 25m;

  # Génération de bulletins PDF et d'emplois du temps : quelques dizaines de
  # secondes sur un gros établissement.
  proxy_connect_timeout 10s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;

  # On ne publie pas la version de nginx.
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  location / {
    proxy_pass http://jawal_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Rechargement à chaud de Next en développement et flux SSE éventuels.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
  }

  # Les fichiers statiques de Next portent un hash dans leur nom : ils peuvent
  # être mis en cache sans risque de servir une version périmée.
  location /_next/static/ {
    proxy_pass http://jawal_web;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Sonde de santé : pas de log, sinon elle noie le journal d'accès.
  location = /api/health {
    proxy_pass http://jawal_web;
    proxy_set_header Host $host;
    access_log off;
  }
}
