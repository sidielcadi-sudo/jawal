# Pile applicative LeadSchool — un fichier, deux environnements.
#
# Le nom de projet, le préfixe des conteneurs et le port HTTP viennent de
# l'environnement : la même définition sert donc la production et la recette,
# sans copie divergente. Voir infra/deploy/scripts/deploy.sh.
#
#   STACK_NAME=leadschool-prod     HTTP_PORT=80
#   STACK_NAME=leadschool-recette  HTTP_PORT=8080
#
# PostgreSQL n'est PAS dans cette pile : il est installé sur l'hôte, avec ses
# bases et ses rôles déjà créés. Les conteneurs l'atteignent par
# `host.docker.internal`, résolu vers la passerelle Docker.
name: ${STACK_NAME}

services:
  redis:
    image: redis:7-alpine
    container_name: ${STACK_NAME}-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Stockage objet S3-compatible : photos, pièces d'inscription, logos.
  garage:
    image: dxflrs/garage:v2.1.0
    container_name: ${STACK_NAME}-garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: 'true'
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      # Image sans shell : `garage status` interroge le nœud en RPC.
      test: ['CMD', '/garage', 'status']
      interval: 10s
      timeout: 5s
      retries: 20

  # Pose la disposition du cluster, la clé d'accès et le bucket, puis s'arrête.
  garage-init:
    image: curlimages/curl:8.11.1
    container_name: ${STACK_NAME}-garage-init
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_HOST: garage
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ../garage/init.sh:/init.sh:ro
    entrypoint: ['sh', '/init.sh']
    restart: 'no'

  # Génération des emplois du temps (OR-Tools + FET).
  solver:
    build:
      context: ../../apps/solver
      dockerfile: Dockerfile
    image: ${STACK_NAME}/solver:latest
    container_name: ${STACK_NAME}-solver
    restart: unless-stopped
    environment:
      PORT: 8000

  web:
    build:
      # Contexte = racine du monorepo (workspace pnpm complet).
      context: ../..
      dockerfile: infra/deploy/Dockerfile.web
    image: ${STACK_NAME}/web:latest
    container_name: ${STACK_NAME}-web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    # Postgres tourne sur l'hôte, hors du réseau Docker.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL}
      APP_NAME: ${APP_NAME:-LeadSchool}
      AUTH_URL: ${APP_URL}
      NEXTAUTH_URL: ${APP_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      CRON_SECRET: ${CRON_SECRET:-${AUTH_SECRET}}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_APP: ${DATABASE_URL_APP}
      REDIS_URL: redis://redis:6379
      SOLVER_URL: http://solver:8000
      S3_ENDPOINT: http://garage:3900
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFY_DRIVER: ${NOTIFY_DRIVER:-log}
      CMI_MERCHANT_ID: ${CMI_MERCHANT_ID:-}
      CMI_STORE_KEY: ${CMI_STORE_KEY:-}
      CMI_GATEWAY_URL: ${CMI_GATEWAY_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}

  # Travaux quotidiens : rappels d'échéances, d'appels, d'examens…
  # Désactivé en recette par défaut (profil `crons`) : une base de recette ne
  # doit pas écrire aux familles.
  cron:
    image: alpine:3.21
    container_name: ${STACK_NAME}-cron
    restart: unless-stopped
    profiles: ['crons']
    depends_on:
      - web
    environment:
      CRON_SECRET: ${CRON_SECRET:-${AUTH_SECRET}}
      WEB_URL: http://web:3000
    volumes:
      - ./run-crons.sh:/run-crons.sh:ro
    command: >
      sh -c "apk add --no-cache curl tzdata >/dev/null &&
             printf '%s\n' '15 2 * * * /run-crons.sh' > /etc/crontabs/root &&
             crond -f -l 8"

  nginx:
    image: nginx:1.27-alpine
    container_name: ${STACK_NAME}-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '${HTTP_PORT}:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  garage_meta:
  garage_data:
